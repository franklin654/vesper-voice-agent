[project]
name = "vesper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Sivakesh", email = "saisivakesh1708@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "numpy==2.4.6",
    "openwakeword==0.6.0",
    "python-dotenv==1.2.3",
    "sarvamai==0.1.31a4",
    "sounddevice==0.5.6",
    "soxr==1.1.0",
]

[project.scripts]
vesper = "vesper:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
