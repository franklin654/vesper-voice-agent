[project]
name = "vesper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Sivakesh", email = "saisivakesh1708@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "livekit-wakeword<2.0.0",
    "numpy>=2.5.4",
    "pvrecorder>=1.2.7",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sarvamai>=0.1.43",
    "soundfile>=0.14.0",
]

[project.scripts]
vesper = "vesper:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "livekit-wakeword[eval,export,train]<=0.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
